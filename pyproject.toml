[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-town-core"
version = "0.1.0"
description = "Versioned contracts and configuration catalogs for AI Town"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["python/town_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["python/tests", "integration_tests"]
pythonpath = ["python"]
markers = [
  "qa: QA-owned regression coverage",
  "m0: M0 acceptance and contract coverage",
  "integration: cross-component repository checks",
  "contract_pending: temporary marker for an unavailable upstream contract",
  "slow: tests excluded from the default fast lane",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/specs"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
files = ["python/town_core", "python/tests", "integration_tests", "tools/diagnostics"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
