name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-baseline:
    name: QA baseline (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements/qa.txt

      - name: Install project and QA tools
        run: python -m pip install -e ".[test]"

      - name: Ruff lint
        run: >-
          ruff check --output-format=github
          tools/diagnostics python/tests/qa integration_tests

      - name: Ruff format check
        run: >-
          ruff format --check
          tools/diagnostics python/tests/qa integration_tests

      - name: Mypy strict
        run: >-
          mypy --strict --explicit-package-bases
          tools/diagnostics python/tests/qa integration_tests

      - name: QA regression tests
        run: >-
          pytest --strict-config --strict-markers
          -m "not contract_pending and not m1 and not m2"
          python/tests/qa integration_tests

      - name: M0 diagnostics (pending upstream inputs allowed)
        run: >-
          python tools/diagnostics/check_m0.py
          --allow-pending-m0-inputs

  m0-readiness:
    name: M0 readiness (gating)
    needs: qa-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and QA tools
        run: python -m pip install -e ".[test]"

      - name: Build strict M0 diagnostic report
        continue-on-error: true
        run: >-
          python tools/diagnostics/check_m0.py
          --json-output "${RUNNER_TEMP}/m0-diagnostics.json"

      - name: Ruff repository lint
        run: ruff check --output-format=github .

      - name: Mypy authority package
        run: mypy python/town_core

      - name: Run all Python tests
        run: >-
          pytest --strict-config --strict-markers
          -m "not m1 and not m2"
          python/tests integration_tests

      - name: Upload M0 diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m0-diagnostics
          path: ${{ runner.temp }}/m0-diagnostics.json
          if-no-files-found: warn

  m1-qa-readiness:
    name: M1 QA readiness (integration-aware)
    needs: m0-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and QA tools
        run: python -m pip install -e ".[test]"

      - name: Run M1 validator regression tests
        run: >-
          pytest --strict-config --strict-markers
          python/tests/qa/test_m1_diagnostics.py

      - name: Build M1 diagnostic evidence
        run: >-
          python tools/diagnostics/check_m1.py
          --output-root "${RUNNER_TEMP}/stwm-m1-qa"
          --json-output "${RUNNER_TEMP}/m1-diagnostics.json"
          --require-sim

      - name: Run M1 black-box acceptance adapter
        shell: bash
        run: |
          if [[ -f "${RUNNER_TEMP}/stwm-m1-qa/m1_qa_evidence.json" ]]; then
            export STWM_M1_QA_EVIDENCE="${RUNNER_TEMP}/stwm-m1-qa/m1_qa_evidence.json"
          fi
          pytest --strict-config --strict-markers -m m1 integration_tests

      - name: Upload M1 diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1-diagnostics
          path: |
            ${{ runner.temp }}/m1-diagnostics.json
            ${{ runner.temp }}/stwm-m1-qa/m1_qa_evidence.json
          if-no-files-found: warn

  m2-qa-readiness:
    name: M2 QA readiness (integration-aware)
    needs: m1-qa-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and QA tools
        run: python -m pip install -e ".[test]"

      - name: Run M2 validator regression tests
        run: >-
          pytest --strict-config --strict-markers
          python/tests/qa/test_m2_diagnostics.py

      - name: Build integration-aware M2 diagnostics
        run: >-
          python tools/diagnostics/check_m2.py
          --json-output "${RUNNER_TEMP}/m2-diagnostics.json"

      - name: Run M2 gray-box acceptance adapter
        run: >-
          pytest --strict-config --strict-markers
          -m m2 integration_tests

      - name: Upload M2 diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m2-diagnostics
          path: ${{ runner.temp }}/m2-diagnostics.json
          if-no-files-found: warn
